<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Technical Skills">
<defs><pattern id="c" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#fff" stroke-opacity="0.035"/></pattern>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B0D"/><stop offset="1" stop-color="#17181C"/></linearGradient></defs>
<g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="210" fill="url(#g)"/><rect width="1200" height="210" fill="url(#c)"/>
<rect x="0" y="0" width="6" height="210" fill="#E10600"><animate attributeName="height" from="0" to="210" dur="0.9s" fill="freeze"/></rect>
<text x="64" y="44" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="5">TECHNICAL SKILLS</text>
<rect x="64" y="54" width="48" height="2" fill="#E10600"/>
<text x="64" y="78" fill="#E10600" font-size="12" font-weight="700" letter-spacing="2">CONTROL &amp; MODELLING</text>
<text x="260" y="78" fill="#D1D5DB" font-size="15">Field-oriented control, MPC / QP-based control, MATLAB / Simulink, PV simulation</text>
<text x="64" y="108" fill="#E10600" font-size="12" font-weight="700" letter-spacing="2">EMBEDDED</text>
<text x="260" y="108" fill="#D1D5DB" font-size="15">C / C++, CAN, microcontrollers, RTOS</text>
<text x="64" y="138" fill="#E10600" font-size="12" font-weight="700" letter-spacing="2">SOFTWARE</text>
<text x="260" y="138" fill="#D1D5DB" font-size="15">Python, ROS, Docker, Git, Linux, LaTeX</text>
<text x="64" y="168" fill="#E10600" font-size="12" font-weight="700" letter-spacing="2">MECHANICAL</text>
<text x="260" y="168" fill="#D1D5DB" font-size="15">CAD (NX), Abaqus FEA, LabVIEW</text>
</g></svg>