<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="William Vandevoir, Drivetrain and Control Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#17181C"/>
    </linearGradient>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 8L8 0" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E10600"/>
      <stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#carbon)"/>

    <!-- diagonal accent stripes, right -->
    <g opacity="0.9">
      <polygon points="760,0 830,0 650,240 580,240" fill="#E10600" opacity="0.9">
        <animate attributeName="opacity" values="0;0.9" dur="1.2s" fill="freeze"/>
      </polygon>
      <polygon points="850,0 872,0 692,240 670,240" fill="#ffffff" opacity="0.85">
        <animate attributeName="opacity" values="0;0.85" dur="1.6s" fill="freeze"/>
      </polygon>
    </g>

    <!-- telemetry trace -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 200 L60 200 L90 175 L140 183 L180 148 L230 160 L270 122 L330 138 L370 104 L430 120 L480 96 L540 112 L590 88"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M0 200 L60 200 L90 175 L140 183 L180 148 L230 160 L270 122 L330 138 L370 104 L430 120 L480 96 L540 112 L590 88"
            stroke="#E10600" stroke-width="2" stroke-dasharray="800" stroke-dashoffset="800">
        <animate attributeName="stroke-dashoffset" from="800" to="0" dur="2.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </path>
    </g>

    <!-- text -->
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="48" y="78" fill="#9CA3AF" font-size="16" letter-spacing="3" font-weight="700">DRIVETRAIN &amp; CONTROL SYSTEMS ENGINEER
        <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      </text>
      <text x="46" y="140" fill="#FFFFFF" font-size="56" font-weight="700">William Vandevoir
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.2s" fill="freeze"/>
      </text>
      <text x="48" y="184" fill="#D1D5DB" font-size="20">aCentauri Solar Racing  ·  MSc Mechanical Engineering, ETH Zürich
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.4s" fill="freeze"/>
      </text>
    </g>

    <!-- bottom sector bar -->
    <rect x="0" y="232" width="900" height="8" fill="#0B0B0D"/>
    <rect x="0" y="234" width="900" height="2" fill="url(#fade)"/>
    <rect x="-200" y="232" width="200" height="8" fill="#E10600">
      <animate attributeName="x" from="-200" to="900" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
