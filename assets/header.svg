<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="William Vandevoir, Drivetrain and Control Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#17181C"/>
    </linearGradient>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 8L8 0" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E10600"/>
      <stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="280"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#carbon)"/>

    <!-- diagonal accent stripes, right -->
    <g opacity="0.9">
      <polygon points="930,0 990,0 810,280 750,280" fill="#E10600" opacity="0.9">
        <animate attributeName="opacity" values="0;0.9" dur="1.2s" fill="freeze"/>
      </polygon>
      <polygon points="1010,0 1030,0 850,280 830,280" fill="#ffffff" opacity="0.85">
        <animate attributeName="opacity" values="0;0.85" dur="1.6s" fill="freeze"/>
      </polygon>
    </g>

    <!-- telemetry trace -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 210 L90 210 L130 180 L190 190 L240 150 L300 165 L350 120 L420 140 L470 100 L540 118 L600 90 L680 110 L740 80"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M0 210 L90 210 L130 180 L190 190 L240 150 L300 165 L350 120 L420 140 L470 100 L540 118 L600 90 L680 110 L740 80"
            stroke="#E10600" stroke-width="2" stroke-dasharray="900" stroke-dashoffset="900">
        <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </path>
    </g>

    <!-- text -->
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="64" y="104" fill="#9CA3AF" font-size="13" letter-spacing="4" font-weight="600">DRIVETRAIN &amp; CONTROL SYSTEMS ENGINEER
        <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
      </text>
      <text x="62" y="170" fill="#FFFFFF" font-size="64" font-weight="700" letter-spacing="1">William Vandevoir
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.2s" fill="freeze"/>
      </text>
      <text x="64" y="212" fill="#D1D5DB" font-size="16" letter-spacing="1">aCentauri Solar Racing  ·  MSc Mechanical Engineering, ETH Zürich
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.4s" fill="freeze"/>
      </text>
    </g>

    <!-- bottom sector bar -->
    <rect x="0" y="272" width="1200" height="8" fill="#0B0B0D"/>
    <rect x="0" y="274" width="1200" height="2" fill="url(#fade)"/>
    <rect x="-200" y="272" width="200" height="8" fill="#E10600">
      <animate attributeName="x" from="-200" to="1200" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
